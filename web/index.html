<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WuWa Companion</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside>
    <div class="brand"><span>W</span><div><h1>鸣潮管家</h1><small>WuWa Companion</small></div></div>
    <nav aria-label="功能">
      <button type="button" class="active" data-view="build"><i>◆</i>角色与声骸</button>
      <button type="button" data-view="gacha"><i>✦</i>抽卡分析</button>
    </nav>
    <div class="source"><p>评分配置来自 WWUID<br>数据来自 WuWaBuilds</p><button id="rule-update" type="button">正在检查评分配置…</button></div>
  </aside>
  <main id="build-view">
    <section class="controls">
      <header>
        <div><p class="eyebrow">RESONATOR ARCHIVE</p><h2>角色与声骸</h2><p class="lead">同步档案，选择角色查看完整评分。</p></div>
        <a class="external" href="https://wuwa.build/import" target="_blank" rel="noreferrer">管理 Build <span>↗</span></a>
      </header>
      <form id="profile-form" class="search-card">
        <label for="profile">WuWaBuilds 玩家档案</label>
        <div class="input-row">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="profile" name="profile" autocomplete="off" inputmode="numeric" placeholder="输入 UID" required>
          <button id="refresh" type="submit">同步</button>
        </div>
        <p id="status" role="status">数据保存在本机，不需要登录游戏账号</p>
      </form>
      <section id="overview" aria-live="polite"></section>
      <section id="build-diff" aria-live="polite"></section>
      <section id="roster" aria-label="选择角色"></section>
    </section>
    <section id="builds" aria-live="polite"></section>
  </main>
  <main id="gacha-view" hidden>
    <section class="tracker-shell">
      <header class="tracker-toolbar">
        <div><strong>WuWa Tracker</strong><span id="tracker-platform"></span><small id="convene-status" role="status">正在准备抽卡追踪器…</small></div>
        <div class="tracker-actions">
          <button id="convene-refresh" type="button">自动获取链接</button>
          <button type="button" data-tracker-page="import">导入记录</button>
          <button type="button" data-tracker-page="tracker">查看分析</button>
          <a id="tracker-external" href="https://wuwatracker.com/zh-CN/tracker" target="_blank" rel="noreferrer">新窗口 ↗</a>
        </div>
        <div id="convene-copy" hidden><input id="convene-url" type="password" readonly aria-label="已提取的抽卡链接"><button id="convene-copy-button" type="button">复制链接</button></div>
      </header>
      <iframe id="tracker-frame" title="WuWa Tracker 抽卡分析" src="https://wuwatracker.com/zh-CN/tracker" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write"></iframe>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
